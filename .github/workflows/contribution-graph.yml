name: Generate contribution graph

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-graph
  cancel-in-progress: false

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution activity SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kawaiy
          github_token: ${{ github.token }}
          outputs: |
            dist/contribution-light.svg?palette=github-light&color_snake=blue
            dist/contribution-dark.svg?palette=github-dark&color_snake=blue

      - name: Check out profile scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate privacy-safe overview (public calendar only)
        run: python3 scripts/contribution_overview.py

      - name: Publish SVGs to output branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/profile-graph
          cp dist/*.svg /tmp/profile-graph/
          git init publish
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth=1 origin output; then
            git checkout -B output FETCH_HEAD
          else
            git checkout --orphan output
          fi
          cp /tmp/profile-graph/*.svg .
          git add contribution-light.svg contribution-dark.svg overview-light.svg overview-dark.svg
          if git diff --cached --quiet; then
            echo "No new SVG changes."
            exit 0
          fi
          git commit -m "chore: update contribution activity graph"
          git push origin HEAD:output
